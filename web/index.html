<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Hub</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .msg-content pre { background: #1e293b; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; }
    .msg-content code { font-size: 0.85em; }
    .msg-content p { margin-bottom: 0.5rem; }
    .typing-dot { animation: blink 1.4s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex" x-data="app()" x-init="init()">

  <!-- Sidebar -->
  <div class="w-72 bg-gray-900 border-r border-gray-800 flex flex-col">
    <div class="p-4 border-b border-gray-800">
      <h1 class="text-lg font-bold text-purple-400">Agent Hub</h1>
      <p class="text-xs text-gray-500 mt-1">Claude Code Multi-Agent</p>
    </div>

    <!-- Agent list -->
    <div class="flex-1 overflow-y-auto p-2">
      <template x-for="agent in agents" :key="agent.id">
        <div
          class="p-3 rounded-lg mb-1 cursor-pointer transition-colors"
          :class="selectedAgent?.id === agent.id ? 'bg-purple-900/30 border border-purple-700' : 'hover:bg-gray-800'"
          @click="selectAgent(agent)"
        >
          <div class="flex items-center justify-between">
            <span class="font-medium text-sm" x-text="agent.name"></span>
            <div class="flex items-center gap-1">
              <span class="text-xs text-gray-500" x-text="agent.model"></span>
              <span
                x-show="agent.is_active"
                class="w-2 h-2 rounded-full bg-green-500"
                title="Active"
              ></span>
              <button
                @click.stop="killAgent(agent.id)"
                class="text-gray-500 hover:text-red-400 text-xs p-1"
                title="Kill agent"
              >&times;</button>
            </div>
          </div>
          <div class="text-xs text-gray-500 truncate mt-1" x-text="agent.cwd"></div>
          <div x-show="agent.total_cost_usd > 0" class="text-xs text-yellow-600 mt-0.5" x-text="'$' + Number(agent.total_cost_usd).toFixed(4)"></div>
        </div>
      </template>
    </div>

    <!-- Spawn form -->
    <div class="p-3 border-t border-gray-800">
      <div class="space-y-2">
        <input
          x-model="newAgent.name"
          placeholder="Agent name"
          class="w-full bg-gray-800 text-sm rounded px-3 py-2 border border-gray-700 focus:border-purple-500 outline-none"
        >
        <input
          x-model="newAgent.cwd"
          placeholder="Working directory"
          class="w-full bg-gray-800 text-sm rounded px-3 py-2 border border-gray-700 focus:border-purple-500 outline-none"
        >
        <button
          @click="spawnAgent()"
          class="w-full bg-purple-600 hover:bg-purple-700 text-sm rounded px-3 py-2 font-medium transition-colors"
        >
          Spawn Agent
        </button>
      </div>
    </div>

    <!-- Bot section -->
    <div class="p-3 border-t border-gray-800">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-medium text-gray-400">Bots</span>
        <button @click="showBotForm = !showBotForm" class="text-xs text-purple-400 hover:text-purple-300">+ Add</button>
      </div>
      <div x-show="showBotForm" class="space-y-2 mb-2">
        <input x-model="newBot.name" placeholder="Bot name" class="w-full bg-gray-800 text-xs rounded px-2 py-1.5 border border-gray-700 outline-none">
        <input x-model="newBot.token" placeholder="Bot token" type="password" class="w-full bg-gray-800 text-xs rounded px-2 py-1.5 border border-gray-700 outline-none">
        <button @click="addBot()" class="w-full bg-gray-700 hover:bg-gray-600 text-xs rounded px-2 py-1.5">Register Bot</button>
      </div>
      <template x-for="b in bots" :key="b.id">
        <div class="flex items-center justify-between text-xs py-1">
          <span :class="b.is_active ? 'text-green-400' : 'text-gray-500'" x-text="b.name"></span>
          <button @click="deleteBot(b.name)" class="text-gray-600 hover:text-red-400">&times;</button>
        </div>
      </template>
    </div>
  </div>

  <!-- Chat panel -->
  <div class="flex-1 flex flex-col">
    <!-- Header -->
    <div class="p-4 border-b border-gray-800 flex items-center justify-between" x-show="selectedAgent">
      <div>
        <h2 class="font-bold" x-text="selectedAgent?.name"></h2>
        <span class="text-xs text-gray-500" x-text="selectedAgent?.cwd"></span>
      </div>
      <div class="flex gap-2">
        <button
          @click="showSettings = !showSettings"
          class="text-xs bg-gray-800 hover:bg-gray-700 rounded px-3 py-1"
        >Settings</button>
        <button
          @click="forkAgent()"
          class="text-xs bg-gray-800 hover:bg-gray-700 rounded px-3 py-1"
        >Fork</button>
        <button
          @click="resetConversation()"
          class="text-xs bg-gray-800 hover:bg-gray-700 rounded px-3 py-1"
        >Reset</button>
        <button
          @click="setActive()"
          class="text-xs bg-purple-600/30 hover:bg-purple-600/50 rounded px-3 py-1"
          x-show="!selectedAgent?.is_active"
        >Set Active</button>
      </div>
    </div>

    <!-- Settings Panel -->
    <div x-show="showSettings && selectedAgent" x-cloak class="p-4 border-b border-gray-800 bg-gray-900/50 space-y-3">
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Model</label>
          <select
            x-model="settings.model"
            @change="saveSettings()"
            class="w-full bg-gray-800 text-sm rounded px-2 py-1.5 border border-gray-700 outline-none"
          >
            <option value="sonnet">Sonnet</option>
            <option value="opus">Opus</option>
            <option value="haiku">Haiku</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Effort</label>
          <select
            x-model="settings.effort"
            @change="saveSettings()"
            class="w-full bg-gray-800 text-sm rounded px-2 py-1.5 border border-gray-700 outline-none"
          >
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Permission</label>
          <select
            x-model="settings.permission_mode"
            @change="saveSettings()"
            class="w-full bg-gray-800 text-sm rounded px-2 py-1.5 border border-gray-700 outline-none"
          >
            <option value="bypassPermissions">Bypass All</option>
            <option value="acceptEdits">Accept Edits</option>
            <option value="default">Default</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">System Prompt</label>
        <textarea
          x-model="settings.system_prompt"
          @change="saveSettings()"
          rows="2"
          placeholder="Optional system prompt..."
          class="w-full bg-gray-800 text-sm rounded px-3 py-2 border border-gray-700 outline-none resize-none"
        ></textarea>
      </div>
      <div class="flex items-center gap-4 text-xs text-gray-400">
        <span x-show="costData">Cost: $<span x-text="costData?.total_cost_usd?.toFixed(4) || '0.0000'"></span></span>
        <span x-show="costData">Requests: <span x-text="costData?.request_count || 0"></span></span>
        <span x-show="costData">Tokens: <span x-text="((costData?.total_input_tokens || 0) + (costData?.total_output_tokens || 0)).toLocaleString()"></span></span>
      </div>
    </div>

    <!-- No agent selected -->
    <div x-show="!selectedAgent" class="flex-1 flex items-center justify-center text-gray-600">
      <p>Select or spawn an agent to begin</p>
    </div>

    <!-- Messages -->
    <div
      x-ref="messages"
      x-show="selectedAgent"
      class="flex-1 overflow-y-auto p-4 space-y-4"
    >
      <template x-for="(msg, i) in messages" :key="i">
        <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
          <div
            :class="msg.role === 'user'
              ? 'bg-purple-600 rounded-2xl rounded-br-sm px-4 py-2 max-w-2xl'
              : 'bg-gray-800 rounded-2xl rounded-bl-sm px-4 py-2 max-w-3xl'"
          >
            <div
              class="msg-content text-sm whitespace-pre-wrap"
              x-html="renderMarkdown(msg.content)"
            ></div>
          </div>
        </div>
      </template>

      <!-- Typing indicator -->
      <div x-show="isProcessing" class="flex justify-start">
        <div class="bg-gray-800 rounded-2xl rounded-bl-sm px-4 py-3">
          <div class="flex gap-1">
            <span class="typing-dot w-2 h-2 bg-gray-500 rounded-full"></span>
            <span class="typing-dot w-2 h-2 bg-gray-500 rounded-full"></span>
            <span class="typing-dot w-2 h-2 bg-gray-500 rounded-full"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div x-show="selectedAgent" class="p-4 border-t border-gray-800">
      <div class="flex gap-2">
        <textarea
          x-model="input"
          @keydown.enter.meta="sendMessage()"
          @keydown.ctrl.enter="sendMessage()"
          placeholder="Message the agent... (Cmd+Enter to send)"
          rows="2"
          class="flex-1 bg-gray-800 text-sm rounded-lg px-4 py-3 border border-gray-700 focus:border-purple-500 outline-none resize-none"
          :disabled="isProcessing"
        ></textarea>
        <button
          @click="sendMessage()"
          :disabled="isProcessing || !input.trim()"
          class="bg-purple-600 hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg px-6 font-medium transition-colors self-end"
        >Send</button>
      </div>
    </div>
  </div>

<script>
function app() {
  return {
    agents: [],
    selectedAgent: null,
    messages: [],
    input: '',
    isProcessing: false,
    ws: null,
    newAgent: { name: '', cwd: '/home/bajistic' },
    apiKey: localStorage.getItem('agentHubApiKey') || '',
    streamBuffer: '',
    showSettings: false,
    settings: { model: 'sonnet', effort: 'high', permission_mode: 'bypassPermissions', system_prompt: '' },
    costData: null,
    bots: [],
    showBotForm: false,
    newBot: { name: '', token: '' },

    async init() {
      if (!this.apiKey) {
        this.apiKey = prompt('Enter API key (leave empty if none):') || '';
        if (this.apiKey) localStorage.setItem('agentHubApiKey', this.apiKey);
      }
      await this.loadAgents();
      await this.loadBots();
    },

    headers() {
      const h = { 'Content-Type': 'application/json' };
      if (this.apiKey) h['X-Api-Key'] = this.apiKey;
      return h;
    },

    async loadAgents() {
      try {
        const r = await fetch('/agents/api/agents', { headers: this.headers() });
        this.agents = await r.json();
      } catch (e) {
        console.error('Failed to load agents:', e);
      }
    },

    async loadBots() {
      try {
        const r = await fetch('/agents/api/bots', { headers: this.headers() });
        this.bots = await r.json();
      } catch (e) {
        console.error('Failed to load bots:', e);
      }
    },

    selectAgent(agent) {
      this.selectedAgent = agent;
      this.messages = [];
      this.settings = {
        model: agent.model || 'sonnet',
        effort: agent.effort || 'high',
        permission_mode: agent.permission_mode || 'bypassPermissions',
        system_prompt: agent.system_prompt || '',
      };
      this.loadCost(agent.id);
      this.connectWs(agent.id);
    },

    async loadCost(agentId) {
      try {
        const r = await fetch(`/agents/api/agents/${agentId}/cost`, { headers: this.headers() });
        this.costData = await r.json();
      } catch (e) {
        console.error('Failed to load cost:', e);
      }
    },

    connectWs(agentId) {
      if (this.ws) this.ws.close();
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      this.ws = new WebSocket(`${proto}//${location.host}/agents/ws/agents/${agentId}`);
      this.ws.onmessage = (e) => {
        try {
          const chunk = JSON.parse(e.data);
          if (chunk.type === 'text') {
            this.streamBuffer += chunk.content;
            this.updateLastAssistant(this.streamBuffer);
          } else if (chunk.type === 'tool_use') {
            this.streamBuffer += '\n' + chunk.content + '\n';
            this.updateLastAssistant(this.streamBuffer);
          } else if (chunk.type === 'done') {
            this.isProcessing = false;
            this.streamBuffer = '';
            if (this.selectedAgent) this.loadCost(this.selectedAgent.id);
          } else if (chunk.type === 'error') {
            this.messages.push({ role: 'assistant', content: 'Error: ' + chunk.content });
            this.isProcessing = false;
          }
          this.scrollToBottom();
        } catch {}
      };
      this.ws.onclose = () => {
        this.isProcessing = false;
      };
    },

    updateLastAssistant(content) {
      const last = this.messages[this.messages.length - 1];
      if (last && last.role === 'assistant' && last.streaming) {
        last.content = content;
      } else {
        this.messages.push({ role: 'assistant', content, streaming: true });
      }
    },

    sendMessage() {
      if (!this.input.trim() || !this.ws || this.isProcessing) return;
      const text = this.input.trim();
      this.input = '';
      this.messages.push({ role: 'user', content: text });
      this.isProcessing = true;
      this.streamBuffer = '';
      this.ws.send(text);
      this.scrollToBottom();
    },

    async spawnAgent() {
      if (!this.newAgent.name.trim()) return;
      try {
        await fetch('/agents/api/agents', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify({ name: this.newAgent.name, cwd: this.newAgent.cwd }),
        });
        this.newAgent = { name: '', cwd: '/home/bajistic' };
        await this.loadAgents();
      } catch (e) {
        console.error('Failed to spawn agent:', e);
      }
    },

    async killAgent(id) {
      if (!confirm('Kill this agent?')) return;
      try {
        await fetch(`/agents/api/agents/${id}`, { method: 'DELETE', headers: this.headers() });
        if (this.selectedAgent?.id === id) {
          this.selectedAgent = null;
          this.messages = [];
        }
        await this.loadAgents();
      } catch (e) {
        console.error('Failed to kill agent:', e);
      }
    },

    async resetConversation() {
      if (!this.selectedAgent) return;
      try {
        await fetch(`/agents/api/agents/${this.selectedAgent.id}/reset`, {
          method: 'POST',
          headers: this.headers(),
        });
        this.messages = [];
      } catch (e) {
        console.error('Failed to reset:', e);
      }
    },

    async setActive() {
      if (!this.selectedAgent) return;
      try {
        await fetch(`/agents/api/agents/${this.selectedAgent.id}/active`, {
          method: 'PATCH',
          headers: this.headers(),
        });
        await this.loadAgents();
      } catch (e) {
        console.error('Failed to set active:', e);
      }
    },

    async saveSettings() {
      if (!this.selectedAgent) return;
      try {
        const r = await fetch(`/agents/api/agents/${this.selectedAgent.id}/settings`, {
          method: 'PATCH',
          headers: this.headers(),
          body: JSON.stringify(this.settings),
        });
        const updated = await r.json();
        // Update local state
        const idx = this.agents.findIndex(a => a.id === this.selectedAgent.id);
        if (idx >= 0) Object.assign(this.agents[idx], updated);
        Object.assign(this.selectedAgent, updated);
      } catch (e) {
        console.error('Failed to save settings:', e);
      }
    },

    async forkAgent() {
      if (!this.selectedAgent) return;
      try {
        const r = await fetch(`/agents/api/agents/${this.selectedAgent.id}/fork`, {
          method: 'POST',
          headers: this.headers(),
        });
        const forked = await r.json();
        await this.loadAgents();
        this.selectAgent(forked);
      } catch (e) {
        console.error('Failed to fork agent:', e);
      }
    },

    async addBot() {
      if (!this.newBot.name || !this.newBot.token) return;
      try {
        await fetch('/agents/api/bots', {
          method: 'POST',
          headers: this.headers(),
          body: JSON.stringify({
            name: this.newBot.name,
            token: this.newBot.token,
            agent_id: this.selectedAgent?.id,
          }),
        });
        this.newBot = { name: '', token: '' };
        this.showBotForm = false;
        await this.loadBots();
      } catch (e) {
        console.error('Failed to add bot:', e);
      }
    },

    async deleteBot(name) {
      if (!confirm(`Remove bot "${name}"?`)) return;
      try {
        await fetch(`/agents/api/bots/${name}`, { method: 'DELETE', headers: this.headers() });
        await this.loadBots();
      } catch (e) {
        console.error('Failed to remove bot:', e);
      }
    },

    renderMarkdown(text) {
      if (!text) return '';
      try {
        return marked.parse(text, { breaks: true });
      } catch {
        return text;
      }
    },

    scrollToBottom() {
      this.$nextTick(() => {
        const el = this.$refs.messages;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },
  };
}
</script>
</body>
</html>
